Name: gateway
Host: 127.0.0.1
Port: 3000
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Upstreams:
  - Name: ordering
    Grpc:
      Etcd:
        Hosts:
          - 127.0.0.1:2379
        Key: ordering.rpc
    ProtoSets:
      - pb/ordering.pb
    Mappings:
      - Method: post
        Path: /api/v1/orders
        RpcPath: ordering.Ordering/PlaceOrder
